media:
  input: assets
  output: /assets

content:
  - name: dispatches
    label: Research Dispatches
    type: collection
    path: dispatches
    fields:
      - name: title
        label: Title
        type: string
      - name: category
        label: Category
        type: select
        options:
          values: [salisminster, burj]
      - name: bgImage
        label: Burj Visual Plate
        type: select
        required: false
        options:
          values:
            - label: "10,000 Yen Matrix (Default Burj)"
              value: "yennote.jpg"
            - label: "Alexander Hamilton USD Note"
              value: "alexanderhamilton.jpg"
            - label: "Euro Cathedral Architecture"
              value: "euro.jpg"
      - name: image
        label: Cover Image
        type: image
        required: false
      - name: date
        label: Publication Date
        type: date
        options:
          time: true
      - name: body
        label: Body Content
        type: rich-text