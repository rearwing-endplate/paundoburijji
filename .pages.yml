media:
  input: assets
  output: /assets

content:
  - name: dispatches
    label: Research Dispatches
    type: collection
    path: dispatches
    fields:
      - name: title
        label: Title
        type: string
      - name: category
        label: Category
        type: select
        options:
          values: [salisminster, burj]
      - name: bgImage
        label: Visual Plate Asset
        type: select
        options:
          values:
            - label: "Salisminster (US Treasury)"
              value: "ustreasury.jpg"
            - label: "Burj - Yen Plate"
              value: "yennote.jpg"
            - label: "Burj - Alexander Plate"
              value: "alexanderhamilton.jpg"
            - label: "Burj - Euro Plate"
              value: "euro.jpg"
      - name: image
        label: Cover Image
        type: image
        required: false
      - name: date
        label: Publication Date
        type: date
        options:
          time: true
      - name: body
        label: Body Content
        type: rich-text