name: Build articles, dispatch pages & share previews

on:
  push:
    branches: [ main ]
    paths:
      - 'dispatches/**'        # new / edited dispatches from the CMS
      - 'dispatch.html'        # page template
      - 'scripts/build.js'     # the build itself
      - '*.jpg'                # visual plates in the repo root
      - '*.png'
      - 'assets/**'            # ...or in /assets
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-save gray-matter@4 marked@12 cheerio@1 sharp@0.33

      - name: Build articles.json, dispatch pages and share images
        env:
          # Optional: set a repository variable named SITE_URL (Settings > Secrets and
          # variables > Actions > Variables) e.g. https://poundbridge.com
          # If it is empty the script uses your CNAME file, else <owner>.github.io/<repo>.
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A articles.json d og
          git diff --staged --quiet || (git commit -m "Auto-build articles.json, dispatch pages and share images" && git push)
